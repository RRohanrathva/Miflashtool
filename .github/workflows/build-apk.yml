name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o MiToolLauncher.zip -d launcher

      - name: Use Maven Central mirror (avoids 429 errors)
        run: |
          cat > launcher/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
          }

          rootProject.name = "MiToolLauncher"
          include ':app'
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: launcher
        run: |
          for i in 1 2 3; do
            gradle --no-daemon assembleDebug && exit 0
            echo "Build failed, retrying in 30s ($i/3)"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: MiTool-Launcher-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
